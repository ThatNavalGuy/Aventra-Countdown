<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aventra</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:linear-gradient(180deg,#3b8cff,#8ab8fb);color:#fff;font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 20px}
img{width:96px;height:96px;border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
h1{font-size:clamp(34px,9vw,64px);margin:18px 0 4px;line-height:1.1}
p{margin:0 0 26px;font-size:18px;opacity:.95}
.row{display:flex;gap:10px;justify-content:center}
.box{background:rgba(255,255,255,.2);border-radius:16px;padding:14px 4px;width:clamp(64px,20vw,110px)}
.box b{display:block;font-size:clamp(30px,9vw,56px);line-height:1.1;font-variant-numeric:tabular-nums}
.box span{font-size:12px;opacity:.9;text-transform:uppercase;letter-spacing:.08em}
</style>
</head>
<body>
<img src="logo.png" alt="">
<h1>Aventra</h1>
<p>Releases In:</p>
<div class="row">
  <div class="box"><b id="d">0</b><span>days</span></div>
  <div class="box"><b id="h">0</b><span>hours</span></div>
  <div class="box"><b id="m">0</b><span>mins</span></div>
  <div class="box"><b id="s">0</b><span>secs</span></div>
</div>
<script>
// Fixed moment in time: 12:00 UK time (+01:00 = BST) on Oct 23, 2026
// Everyone sees the same countdown, whatever their timezone
var RELEASE = new Date("2026-10-23T12:00:00+01:00");

function tick() {
  var t = RELEASE - new Date();
  if (t <= 0) {
    // Launch: send visitors to the real site (change this)
    // location.href = "home.html";
    t = 0;
  }
  var v = {
    d: Math.floor(t / 864e5),
    h: Math.floor(t / 36e5) % 24,
    m: Math.floor(t / 6e4) % 60,
    s: Math.floor(t / 1e3) % 60
  };
  for (var k in v) document.getElementById(k).textContent = v[k];
}
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
